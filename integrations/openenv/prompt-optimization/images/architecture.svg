<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 1240 700"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4b5563" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-loop" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow-accent" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b45309" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1240" height="700" fill="#fff"/><text x="620" y="32" fill="#111827" font-size="20" font-weight="700" text-anchor="middle">The prompt optimization loop: raise the environment reward by rewriting the system prompt</text><text x="620" y="52" fill="#6b7280" text-anchor="middle">Only the prompt changes between iterations. Model weights never do.</text><rect width="300" height="384" x="24" y="72" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="12"/><text x="174" y="100" fill="#312e81" font-size="16" font-weight="700" text-anchor="middle">Nebius Token Factory</text><text x="174" y="120" fill="#4338ca" text-anchor="middle">OpenAI-compatible API, hosted open models</text><rect width="260" height="84" x="44" y="144" fill="#fff" stroke="#a5b4fc" rx="8"/><text x="174" y="168" fill="#111827" font-weight="700" text-anchor="middle">Policy model</text><text x="174" y="188" fill="#374151" text-anchor="middle">GLM-5.3-Flash (default)</text><text x="174" y="208" fill="#6b7280" text-anchor="middle">runs the agent with prompt vₙ</text><rect width="260" height="84" x="44" y="244" fill="#fff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="174" y="268" fill="#111827" font-weight="700" text-anchor="middle">Reflector model</text><text x="174" y="288" fill="#374151" text-anchor="middle">Kimi K3</text><text x="174" y="308" fill="#6b7280" text-anchor="middle">reads failures, writes prompt vₙ₊₁</text><rect width="260" height="84" x="44" y="344" fill="#fff" stroke="#a5b4fc" stroke-dasharray="6 4" rx="8"/><text x="174" y="368" fill="#111827" font-weight="700" text-anchor="middle">Judge model (optional)</text><text x="174" y="388" fill="#374151" text-anchor="middle">any Token Factory model</text><text x="174" y="408" fill="#6b7280" text-anchor="middle">scores the decision note, +0.2 max</text><rect width="330" height="384" x="454" y="72" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="12"/><text x="619" y="100" fill="#14532d" font-size="16" font-weight="700" text-anchor="middle">Your laptop</text><text x="619" y="120" fill="#166534" text-anchor="middle">agent.py, optimize.py, evaluate.py</text><rect width="290" height="100" x="474" y="144" fill="#fff" stroke="#86efac" rx="8"/><text x="619" y="168" fill="#111827" font-weight="700" text-anchor="middle">Agent loop (run_episode)</text><text x="488" y="192" fill="#374151">system prompt vₙ + ticket + tool schemas</text><text x="488" y="212" fill="#374151">→ model picks a tool → env.step(...)</text><text x="488" y="232" fill="#374151">→ repeat until the environment says done</text><rect width="290" height="176" x="474" y="262" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="619" y="286" fill="#4c1d95" font-weight="700" text-anchor="middle">Prompt optimizer (optimize.py)</text><text x="488" y="310" fill="#374151">run prompt vₙ on the training seeds</text><text x="488" y="330" fill="#374151">→ collect episodes with reward &lt; 1</text><text x="488" y="350" fill="#374151">→ reflector proposes prompt vₙ₊₁</text><text x="488" y="370" fill="#374151">→ run vₙ₊₁ on the same seeds</text><text x="488" y="390" fill="#374151">→ keep it only if mean reward improves</text><text x="488" y="410" fill="#374151">→ repeat; finally score on held-out seeds</text><text x="619" y="430" fill="#6d28d9" font-size="12" font-style="italic" text-anchor="middle">the only trainable thing is the text of the prompt</text><rect width="302" height="384" x="914" y="72" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="12"/><text x="1065" y="100" fill="#7c2d12" font-size="16" font-weight="700" text-anchor="middle">OpenEnv environment server</text><text x="1065" y="120" fill="#9a3412" text-anchor="middle">access_request_env · FastAPI + WebSocket /ws</text><rect width="282" height="100" x="924" y="144" fill="#fff" stroke="#fdba74" rx="8"/><text x="1065" y="168" fill="#111827" font-weight="700" text-anchor="middle">MCPEnvironment (RFC 003)</text><text x="936" y="192" fill="#374151">read tools: get_ticket, get_employee,</text><text x="936" y="210" fill="#374151">get_system_policy, check_manager_approval</text><text x="936" y="232" fill="#374151">terminal: grant_access, deny_request, escalate</text><rect width="282" height="80" x="924" y="262" fill="#fff" stroke="#fdba74" rx="8"/><text x="1065" y="286" fill="#111827" font-weight="700" text-anchor="middle">Scenario generator + policy engine</text><text x="936" y="310" fill="#374151">seeded tickets, 13 archetypes, mocked HR data</text><text x="936" y="330" fill="#374151">decide() = hidden ground truth (9 ordered rules)</text><rect width="282" height="80" x="924" y="358" fill="#fff" stroke="#fdba74" rx="8"/><text x="1065" y="382" fill="#111827" font-weight="700" text-anchor="middle">Reward on the terminal step</text><text x="936" y="406" fill="#374151" font-size="13">+1 correct · −1 unauthorized grant · +0.2 needless</text><text x="936" y="426" fill="#374151" font-size="13">escalation · penalties for extra / invalid calls</text><line x1="474" x2="304" y1="186" y2="186" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><circle cx="389" cy="168" r="10" fill="#7c3aed"/><text x="389" y="172" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text><text x="389" y="204" fill="#4b5563" font-size="11" text-anchor="middle">prompt vₙ in,</text><text x="389" y="218" fill="#4b5563" font-size="11" text-anchor="middle">tool calls out</text><line x1="764" x2="924" y1="186" y2="186" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><circle cx="849" cy="168" r="10" fill="#7c3aed"/><text x="849" y="172" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text><text x="849" y="204" fill="#4b5563" font-size="11" text-anchor="middle">reset(seed), step(action)</text><text x="849" y="218" fill="#4b5563" font-size="11" text-anchor="middle">→ reward, done</text><line x1="474" x2="304" y1="326" y2="276" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-loop)"/><circle cx="389" cy="301" r="10" fill="#7c3aed"/><text x="389" y="305" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text><text x="389" y="270" fill="#6d28d9" font-size="11" text-anchor="middle">low-reward episodes</text><line x1="304" x2="474" y1="312" y2="366" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-loop)"/><circle cx="389" cy="339" r="10" fill="#7c3aed"/><text x="389" y="343" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text><text x="389" y="374" fill="#6d28d9" font-size="11" text-anchor="middle">prompt vₙ₊₁</text><line x1="764" x2="924" y1="352" y2="302" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-loop)"/><circle cx="849" cy="309" r="10" fill="#7c3aed"/><text x="849" y="313" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">5</text><text x="849" y="352" fill="#6d28d9" font-size="11" text-anchor="middle">re-run vₙ₊₁ on the</text><text x="849" y="366" fill="#6d28d9" font-size="11" text-anchor="middle">same seeds, compare</text><path fill="none" stroke="#b45309" stroke-dasharray="6 4" stroke-width="1.5" marker-end="url(#arrow-accent)" d="M 924 430 C 800 468, 440 468, 304 408"/><text x="620" y="480" fill="#b45309" font-size="12" text-anchor="middle">optional: NoteQualityJudge (OpenEnv Rubric / LLMJudge) calls Token Factory from inside the environment</text><rect width="1192" height="72" x="24" y="496" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" rx="12"/><text x="620" y="522" fill="#713f12" font-weight="700" text-anchor="middle">Measured effect on 26 held-out tickets (mean reward / decision accuracy)</text><text x="620" y="545" fill="#374151" text-anchor="middle">GLM-5.3-Flash: baseline prompt 0.885 / 88% → optimized prompt 1.000 / 100% · MiniMax-M3 (same prompt): 0.923 / 92% → 1.000 / 100%</text><text x="620" y="562" fill="#374151" text-anchor="middle">Qwen3-30B-A3B with its own optimized prompt: 0.044 / 46% → 0.650 / 77% (unauthorized grants 9 → 3)</text><rect width="1192" height="94" x="24" y="584" fill="#f9fafb" stroke="#d1d5db" rx="12"/><text x="620" y="612" fill="#111827" font-weight="700" text-anchor="middle">Same environment package, shipped with the OpenEnv toolchain</text><text x="620" y="636" fill="#374151" text-anchor="middle">openenv validate · openenv build → Docker image for a private VM or Kubernetes · openenv push → Hugging Face Space</text><text x="620" y="656" fill="#6b7280" text-anchor="middle">later: the same environment for TRL GRPO training or for sampling trajectories to fine-tune on</text></svg>